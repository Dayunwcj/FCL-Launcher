# 合并工程编译：:app 是 application，:FCL 是它的后端库（含全部 JNI/CMake）
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 镜像里已经带了 SDK（ANDROID_HOME 已设好），这一步只补我们要的组件
      - name: 装 NDK / CMake / platform
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager=$SDKM"
          "$SDKM" --version
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          "$SDKM" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "sdk.dir=$SDK" > local.properties

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 编译
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 校验原生 so 真的进包
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK=$APK"
          unzip -l "$APK" | grep "lib/arm64-v8a" | head -30
          for so in libpojavexec.so libpojavexec_awt.so libfcl.so libandroidnsbypass.so libgl4es_114.so libbytehook.so libopenal.so; do
            if unzip -l "$APK" | grep -q "lib/arm64-v8a/$so"; then
              echo "OK   lib/arm64-v8a/$so"
            else
              echo "::error::缺少 lib/arm64-v8a/$so（NDK 没编成功）"
              exit 1
            fi
          done

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: FCLauncher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
